<body class="flex items-center justify-center p-4">

    <!-- Corpo da Calculadora -->

            <button onclick="handleAction('num', '4')" class="btn-retro btn-num h-12 text-lg sm:text-xl">4</button>

            <button onclick="handleAction('decimal')" class="btn-retro btn-num h-12 text-lg sm:text-xl">.</button>

        <!-- Rodapé do Chassi -->

    <!-- Lógica da Calculadora em JavaScript -->
    <script>
        // Estado da Calculadora
        let currentValue = '0';
        let previousValue = null;
        let operation = null;
        let resetNextInput = false;
        let soundEnabled = true;

        // Elementos DOM
        const displayEl = document.getElementById('display-value');
        const opIndicatorEl = document.getElementById('op-indicator');
        const errorIndicatorEl = document.getElementById('indicator-error');
        const soundToggle = document.getElementById('sound-toggle');
        const soundKnob = document.getElementById('sound-knob');
        const themeToggle = document.getElementById('theme-toggle');
        const themeKnob = document.getElementById('theme-knob');
        const lcdDisplay = document.getElementById('lcd-display');

        // Sintetizador Web Audio API para Som de Clique Retrô Solido
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

        function playClickSound() {
            if (!soundEnabled) return;
            try {
                if (audioCtx.state === 'suspended') {
                    audioCtx.resume();
                }
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();

                osc.type = 'triangle';
                osc.frequency.setValueAtTime(120, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(40, audioCtx.currentTime + 0.03);

                gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.03);

                osc.connect(gain);
                gain.connect(audioCtx.destination);

                osc.start();
                osc.stop(audioCtx.currentTime + 0.03);
            } catch (e) {
                // Silencioso se o áudio não for permitido no navegador
            }
        }

        // Atualização da Tela
        function updateDisplay() {
            // Limita visualização para caber no visor vintage (máximo 10 caracteres)
            let formattedValue = currentValue;

            if (formattedValue.length > 10) {
                const num = parseFloat(currentValue);
                if (isNaN(num)) {
                    formattedValue = "ERROR";
                } else if (Math.abs(num) >= 1e10 || (Math.abs(num) < 1e-7 && num !== 0)) {
                    formattedValue = num.toExponential(4);
                } else {
                    formattedValue = formattedValue.slice(0, 10);
                }
            }

            displayEl.textContent = formattedValue;
            opIndicatorEl.textContent = operation ? operation : '';
        }

        // Manipulação de Ações
        function handleAction(action, value = null) {
            playClickSound();

            if (errorIndicatorEl.classList.contains('opacity-100') && action !== 'clear') {
                return; // Trava calculadora até pressionar Clear em caso de erro
            }

            switch (action) {
                case 'num':
                    if (currentValue === '0' || resetNextInput) {
                        currentValue = value;
                        resetNextInput = false;
                    } else {
                        if (currentValue.length < 10) {
                            currentValue += value;
                        }
                    }
                    break;

                case 'decimal':
                    if (resetNextInput) {
                        currentValue = '0.';
                        resetNextInput = false;
                    } else if (!currentValue.includes('.')) {
                        currentValue += '.';
                    }
                    break;

                case 'toggle-sign':
                    if (currentValue !== '0') {
                        currentValue = currentValue.startsWith('-') ? currentValue.slice(1) : '-' + currentValue;
                    }
                    break;

                case 'percent':
                    currentValue = (parseFloat(currentValue) / 100).toString();
                    break;

                case 'op':
                    if (operation && !resetNextInput) {
                        calculate();
                    }
                    previousValue = currentValue;
                    operation = value;
                    resetNextInput = true;
                    break;

                case 'equals':
                    if (operation && previousValue !== null) {
                        calculate();
                        operation = null;
                        previousValue = null;
                        resetNextInput = true;
                    }
                    break;

                case 'clear':
                    currentValue = '0';
                    previousValue = null;
                    operation = null;
                    resetNextInput = false;
                    errorIndicatorEl.classList.remove('opacity-100');
                    errorIndicatorEl.classList.add('opacity-20');
                    break;
            }

            updateDisplay();
        }

        // Cálculo Matemático
        function calculate() {
            const prev = parseFloat(previousValue);
            const current = parseFloat(currentValue);
            let result = 0;

            if (isNaN(prev) || isNaN(current)) return;

            switch (operation) {
                case '+':
                    result = prev + current;
                    break;
                case '-':
                    result = prev - current;
                    break;
                case '×':
                    result = prev * current;
                    break;
                case '÷':
                    if (current === 0) {
                        triggerError();
                        return;
                    }
                    result = prev / current;
                    break;
            }

            // Arredondamento para evitar problemas de precisão de ponto flutuante em JS
            result = Math.round(result * 100000000) / 100000000;
            currentValue = result.toString();
        }

        function triggerError() {
            currentValue = "ERROR";
            errorIndicatorEl.classList.remove('opacity-20');
            errorIndicatorEl.classList.add('opacity-100');
        }

        // Toggles de Configuração
        soundToggle.addEventListener('click', () => {
            soundEnabled = !soundEnabled;
            if (soundEnabled) {
                soundKnob.style.transform = 'translateX(1.25rem)';
                playClickSound();
            } else {
                soundKnob.style.transform = 'translateX(0rem)';
            }
        });

        themeToggle.addEventListener('click', () => {
            playClickSound();
            const isAmber = lcdDisplay.classList.toggle('amber');
            if (isAmber) {
                themeKnob.style.transform = 'translateX(1.25rem)';
            } else {
                themeKnob.style.transform = 'translateX(0rem)';
            }
        });

        // Suporte Completo ao Teclado Físico
        document.addEventListener('keydown', (e) => {
            let key = e.key;

            if (!isNaN(key)) {
                handleAction('num', key);
                highlightButton(key);
            } else if (key === '.') {
                handleAction('decimal');
                highlightButton('.');
            } else if (key === '+') {
                handleAction('op', '+');
                highlightButton('+');
            } else if (key === '-') {
                handleAction('op', '-');
                highlightButton('-');
            } else if (key === '*') {
                handleAction('op', '×');
                highlightButton('×');
            } else if (key === '/') {
                e.preventDefault();
                handleAction('op', '÷');
                highlightButton('÷');
            } else if (key === 'Enter' || key === '=') {
                e.preventDefault();
                handleAction('equals');
                highlightButton('=');
            } else if (key === 'Escape' || key.toLowerCase() === 'c') {
                handleAction('clear');
                highlightButton('C/CE');
            } else if (key === '%') {
                handleAction('percent');
                highlightButton('%');
            } else if (key === 'Backspace') {
                if (currentValue.length > 1 && currentValue !== 'ERROR') {
                    currentValue = currentValue.slice(0, -1);
                    if (currentValue === '-' || currentValue === '') currentValue = '0';
                } else {
                    currentValue = '0';
                }
                playClickSound();
                updateDisplay();
            }
        });

        // Efeito visual ao pressionar teclas no teclado físico
        function highlightButton(text) {
            const buttons = Array.from(document.querySelectorAll('button'));
            const btn = buttons.find(b => b.textContent.trim() === text);
            if (btn) {
                btn.classList.add('active-key');
                setTimeout(() => btn.classList.remove('active-key'), 100);
            }
        }
    </script>
</body>
</html>
